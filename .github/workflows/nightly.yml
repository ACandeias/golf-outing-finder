name: nightly

on:
  schedule:
    - cron: "15 7 * * *" # 07:15 UTC, about 3 a.m. Eastern
  workflow_dispatch:
    inputs:
      budget:
        description: "Budget profile: nightly, or smoke (every cap at 5 to 10) for a first live run"
        type: choice
        options: [nightly, smoke]
        default: nightly
      fail_stage:
        description: "Alert test: make this stage throw so the job fails and GitHub emails the owner (discover fails before any paid call)"
        type: choice
        # Must match NIGHTLY_STAGES in packages/pipeline/src/stages/registry.ts (a test checks).
        options:
          - none
          - discover
          - fetch
          - normalize
          - extract-request-build
          - extract-collect
          - classify
          - match
          - dedupe-upsert
          - publish
          - recheck-roll-forward
        default: none
      weekly_report:
        description: "Create or update the Weekly pipeline report issue even if today isn't Monday"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline # shared with monthly.yml so the two never overlap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    permissions:
      contents: read
      issues: write # weekly report issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gof/pipeline exec playwright install --with-deps chromium
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/irs # IRS lookup db; rebuilt by the pipeline when missing
          key: irs-${{ steps.month.outputs.month }}
      # ETag/Last-Modified per URL for conditional GETs. A new key every run (a cache
      # key is never overwritten); restore-keys picks up the latest saved copy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/http-validators.json
          key: http-validators-${{ github.run_id }}
          restore-keys: http-validators-
      # Pending batch ids live only in runs.pending_batch_id, never in a cache.
      # Inputs reach the shell only as env vars, never inlined into the script.
      - run: |
          args=(--live --budget="$BUDGET" --strict)
          if [ -n "$FAIL_STAGE" ] && [ "$FAIL_STAGE" != "none" ]; then args+=("--fail-stage=$FAIL_STAGE"); fi
          if [ "$WEEKLY_REPORT" = "true" ]; then args+=(--weekly-report); fi
          pnpm run pipeline "${args[@]}"
        env:
          BUDGET: ${{ inputs.budget || 'nightly' }}
          FAIL_STAGE: ${{ inputs.fail_stage || 'none' }}
          WEEKLY_REPORT: ${{ inputs.weekly_report == true }}
          NODE_ENV: production
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GH_TOKEN: ${{ github.token }} # weekly report issue (issues: write above)
          # GITHUB_REPOSITORY is set by Actions; the weekly issue goes to this repo.
