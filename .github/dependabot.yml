version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      astro-cloudflare:
        patterns: ["astro", "@astrojs/*", "wrangler", "@cloudflare/*"]
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
