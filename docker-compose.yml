# Run locally in Docker.
#
#   docker compose up --build site   # (pnpm docker:up) built Worker on http://localhost:8787
#
# Dev toolchain services (bind-mount the repo):
#   docker compose up dev            # Astro dev server on http://localhost:4321
#   docker compose run --rm test     # unit + golden tests
#   docker compose run --rm lint     # lint + typecheck
#   docker compose run --rm shell    # shell with Node 22 and pnpm

services:
  site:
    build:
      context: .
      target: runner
    image: gof-site:latest
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      D1_PERSIST_DIR: /data
    volumes:
      - d1-data:/data
    restart: unless-stopped

  dev: &dev
    build:
      context: .
      target: dev
    image: gof-dev:latest
    working_dir: /workspace
    profiles: ["dev"]
    command: pnpm dev
    ports:
      - "4321:4321"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - astro-cache:/workspace/apps/site/.astro
      - wrangler-cache:/workspace/apps/site/.wrangler

  test:
    <<: *dev
    command: pnpm test
    ports: []

  lint:
    <<: *dev
    command: sh -c "pnpm lint && pnpm typecheck"
    ports: []

  shell:
    <<: *dev
    command: bash
    ports: []
    stdin_open: true
    tty: true

volumes:
  d1-data:
  node_modules:
  astro-cache:
  wrangler-cache:
