# Cloudflare Worker running the Astro app (Astro 7, @astrojs/cloudflare 14).
# `astro build` writes the deployable Worker and a generated config under dist/;
# `wrangler dev` and `wrangler deploy` pick that up through .wrangler/deploy/config.json.
# For production, replace database_id with the id from `wrangler d1 create gof`.
# Local dev (wrangler dev, Docker) ignores database_id.

name = "golf-outing-finder"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
PUBLIC_SITE_URL = "http://localhost:8787"
ADS_PROVIDER = "adsense"
PUBLIC_ADSENSE_CLIENT = ""
PUBLIC_GA4_ID = ""
INDEXNOW_KEY = ""
# Search Console and Bing Webmaster Tools tokens (the content value only). The home
# page renders each meta tag only when it is set; DNS verification needs neither.
GOOGLE_SITE_VERIFICATION = ""
BING_SITE_VERIFICATION = ""
SITE_NOW = ""

[[d1_databases]]
binding = "DB"
database_name = "gof"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../packages/db/migrations"

[dev]
ip = "0.0.0.0"
port = 8787

# Secrets (`wrangler secret put`, never committed): TURNSTILE_SECRET
