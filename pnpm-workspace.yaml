packages:
  - "apps/*"
  - "packages/*"

# Build scripts allowed to run. Only well-known upstream packages needed by
# Astro, wrangler and image processing. Review before adding new entries.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Patch-level floors for transitive packages with published fixes (pnpm audit in
# ci.yml). Both arrive through astro; remove an entry once astro's own range
# resolves to the patched version.
overrides:
  # GHSA-wq5f-xc86-pv6w (librsvg in sharp's bundled libvips), fixed in 0.35.5.
  "sharp@<0.35.5": "^0.35.5"
  # GHSA-68fv-2mgg-jv7q, fixed in 1.2.2.
  "source-map-js@<1.2.2": "^1.2.2"
  # GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm, GHSA-xjj6-f33q-929c and
  # GHSA-4w7w-5xrc-9h26, fixed in 7.30.1 and 8.12.2. The 7.x copy arrives
  # through wrangler's miniflare, the 8.x copy through astro's unifont.
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  "undici@>=8.0.0 <8.12.2": "^8.12.2"
  # GHSA-587h-7wmj-h5pm (launch-editor), fixed in 8.3.3; through @astrojs/cloudflare.
  "vite@>=8.3.0 <8.3.3": "^8.3.3"
  # The patched vite brings rolldown 1.2.19, whose unused wasm32 binding asks
  # for @emnapi/runtime 2.0.0-beta.2. pnpm then gives that beta to astro's own
  # wasm tools, and `astro check` crashes on exit. Keep the stable 1.x line
  # until rolldown's binding moves off the beta.
  "@emnapi/runtime@>=2.0.0-0 <2.0.0": "^1.11.3"
  "@emnapi/core@>=2.0.0-0 <2.0.0": "^1.11.3"

# Advisories reviewed and accepted. Revisit when a patched version ships.
auditConfig:
  ignoreGhsas:
    # http-cache-semantics <=4.2.0, no patched release (2026-09-18). Only astro's
    # build-time remote image cache (astro/dist/assets/build/remote.js) uses it; it is
    # not in the Worker bundle and the site sets no cookies. Reviewed 2026-10-03.
    - GHSA-ch52-4w7c-c8xp
