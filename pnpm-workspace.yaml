packages:
  - "apps/*"
  - "packages/*"

# Build scripts allowed to run. Only well-known upstream packages needed by
# Astro, wrangler and image processing. Review before adding new entries.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Patch-level floors for transitive packages with published fixes (pnpm audit in
# ci.yml). Both arrive through astro; remove an entry once astro's own range
# resolves to the patched version.
overrides:
  # GHSA-wq5f-xc86-pv6w (librsvg in sharp's bundled libvips), fixed in 0.35.5.
  "sharp@<0.35.5": "^0.35.5"
  # GHSA-68fv-2mgg-jv7q, fixed in 1.2.2.
  "source-map-js@<1.2.2": "^1.2.2"

# Advisories reviewed and accepted. Revisit when a patched version ships.
auditConfig:
  ignoreGhsas:
    # http-cache-semantics <=4.2.0, no patched release (2026-09-18). Only astro's
    # build-time remote image cache (astro/dist/assets/build/remote.js) uses it; it is
    # not in the Worker bundle and the site sets no cookies. Reviewed 2026-10-03.
    - GHSA-ch52-4w7c-c8xp
